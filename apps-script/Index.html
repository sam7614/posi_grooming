<!doctype html><html lang="ko"><head><base target="_top"><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f2f6f4;color:#1d3d32;line-height:1.65;margin:0}main{max-width:760px;margin:auto;padding:26px 18px 60px}section{background:white;border:1px solid #cedfd5;border-radius:12px;padding:22px;margin:20px 0}h1{font-size:28px;line-height:1.4}h2{font-size:21px}label{display:block;margin:18px 0 6px;font-weight:600}input[type=text],input[type=password],textarea{width:100%;font:inherit;border:1px solid #708b7d;border-radius:6px;padding:10px}textarea{min-height:110px}button{font:inherit;border:0;background:#215d47;color:white;padding:11px 16px;border-radius:6px;margin:12px 8px 0 0;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.note{font-size:14px;color:#4c665b}#status,#loginStatus{white-space:pre-wrap}#status{position:sticky;bottom:0;background:#e7f1ea;padding:12px;border-radius:7px} [hidden]{display:none!important}:focus-visible{outline:3px solid #c98513;outline-offset:3px}
</style></head><body><main>
<h1 id="title">수업 학습기록</h1>
<section id="login"><h2>내 기록 열기</h2><p>교수자가 개별 안내한 참여코드와 개인키를 입력하세요.</p>
<label for="code">참여코드</label><input id="code" type="text" autocomplete="off" maxlength="40">
<label for="key">개인 접속키</label><input id="key" type="password" autocomplete="off" spellcheck="false" maxlength="64">
<button id="load">내 기록 열기</button><p id="loginStatus" role="status"></p>
<p class="note">개인키는 다른 사람에게 공유하지 마세요. 이 앱은 키를 브라우저 저장소나 주소에 보관하지 않습니다. 다시 접속할 때 입력해야 합니다.</p></section>
<div id="workspace" hidden><p id="identity"></p><section><h2 id="caseTitle">사례</h2><p id="description"></p><p class="note">제시된 내용과 자신의 해석을 구분하고 수업에서 배운 기준에 근거해 작성하세요.</p></section>
<section><label for="fact">관찰한 사실</label><textarea id="fact" maxlength="3000"></textarea>
<label for="interpretation">해석과 추가 확인</label><textarea id="interpretation" maxlength="3000"></textarea>
<label for="action">다음 행동과 이유</label><textarea id="action" maxlength="3000"></textarea>
<label for="change">수정한 점과 이유</label><textarea id="change" maxlength="3000" placeholder="피드백을 받은 뒤 바꾼 점과 이유를 적으세요."></textarea>
<label><input id="auto" type="checkbox" checked> 입력을 멈추면 약 3초 후 자동 저장</label>
<p class="note">위 세 필수 항목을 작성하면 자동 저장이 시작됩니다. 서버 처리 시간은 별도로 걸립니다. 저장 완료를 확인한 뒤 닫으세요. 모든 저장 내용은 교수자 시트에 전달되며 수정이력으로 남습니다.</p>
<button id="save">지금 저장 / 실패한 저장 재시도</button><button id="refresh">저장된 기록 다시 불러오기</button><button id="download">내 내용 TXT 저장</button><button id="exit">나가기</button>
<p id="status" role="status" aria-live="polite"></p></section></div>
</main><script>
const $=id=>document.getElementById(id),fields=['fact','interpretation','action','change'];
let auth=null,config=null,revision=0,last='',timer=null,busy=false,pending=null;
function snapshot(){return Object.fromEntries(fields.map(k=>[k,$(k).value]));}
function serial(){return JSON.stringify(snapshot());}
function status(s){$('status').textContent=s;}
function rpc(name,args){return new Promise((resolve,reject)=>{if(!window.google||!google.script){reject(Error('이 화면은 배포된 Apps Script 웹앱 주소에서 열어야 합니다.'));return;}google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||String(e))))[name](...args);});}
function render(data){
 config=data.config;revision=data.record.revision;
 $('title').textContent=config.title;$('description').textContent=config.description;$('caseTitle').textContent='사례: '+config.caseId;
 $('identity').textContent=data.person.name+' ('+data.person.code+')';fields.forEach(k=>{$(k).value=data.record[k];});
 last=serial();pending=null;$('login').hidden=true;$('workspace').hidden=false;
 status(revision?'저장된 기록을 불러왔습니다. 버전 '+revision+' / '+data.record.updated:'새 기록입니다. 세 필수 항목을 작성하세요.');
 if(config.status!=='OPEN')status('접수가 마감되었습니다. 저장할 수 없습니다.');
}
$('load').onclick=async()=>{
 $('load').disabled=true;$('loginStatus').textContent='기록 확인 중…';
 const candidate={code:$('code').value.trim(),key:$('key').value.trim()};
 try{const d=await rpc('getRecord',[candidate]);auth=candidate;$('key').value='';render(d);$('loginStatus').textContent='';}
 catch(e){$('loginStatus').textContent=e.message;}finally{$('load').disabled=false;}
};
function schedule(){clearTimeout(timer);if($('auto').checked&&config?.status==='OPEN')timer=setTimeout(save,3000);}
fields.forEach(k=>$(k).addEventListener('input',()=>{status('미저장 변경이 있습니다.');schedule();}));
$('auto').onchange=()=>{if($('auto').checked)schedule();else clearTimeout(timer);};
async function save(){
 clearTimeout(timer);if(busy||!auth)return;
 if(config.status!=='OPEN'){status('접수가 마감되었습니다.');return;}
 if(!pending&&serial()===last){status('모든 변경이 저장되어 있습니다.');return;}
 if(!pending){const s=snapshot();if(!s.fact.trim()||!s.interpretation.trim()||!s.action.trim()){status('관찰, 해석, 다음 행동을 모두 작성하면 저장됩니다.');return;}
  pending={...s,caseId:config.caseId,baseRevision:revision,requestId:crypto.randomUUID()};
 }
 busy=true;$('save').disabled=true;$('refresh').disabled=true;status('저장 중… 아직 창을 닫지 마세요.');
 try{
  const sent=pending,d=await rpc('saveRecord',[auth,sent]);revision=d.record.revision;config=d.config;
  last=JSON.stringify(Object.fromEntries(fields.map(k=>[k,sent[k]])));pending=null;
  status('저장 완료. 버전 '+revision+' / '+d.record.updated+' (UTC)');
  if(serial()!==last)schedule();
 }catch(e){status('저장 확인 실패: '+e.message+'\n창을 닫지 말고 TXT로 보관하세요. 통신 오류는 지금 저장으로 재시도할 수 있습니다. 버전 충돌이면 다시 불러와 비교하세요.');}
 finally{busy=false;$('save').disabled=false;$('refresh').disabled=false;}
}
$('save').onclick=save;
$('refresh').onclick=async()=>{
 if((serial()!==last||pending)&&!confirm('미저장 내용은 사라집니다. 먼저 TXT로 보관했나요?'))return;
 clearTimeout(timer);try{render(await rpc('getRecord',[auth]));}catch(e){status(e.message);}
};
$('download').onclick=()=>{
 const text=fields.map(k=>({fact:'관찰한 사실',interpretation:'해석과 추가 확인',action:'다음 행동과 이유',change:'수정한 점과 이유'}[k])+':\n'+$(k).value).join('\n\n');
 const u=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='my-learning-record.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
};
$('exit').onclick=()=>{if((busy||pending||serial()!==last)&&!confirm('미저장 내용이 있을 수 있습니다. 나갈까요?'))return;clearTimeout(timer);auth=null;config=null;pending=null;fields.forEach(k=>$(k).value='');$('workspace').hidden=true;$('login').hidden=false;};
window.addEventListener('beforeunload',e=>{if(auth&&(busy||pending||serial()!==last)){e.preventDefault();e.returnValue='';}});
</script></body></html>
